<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%231F3864'/><circle cx='12' cy='12' r='6' fill='none' stroke='white' stroke-width='2'/><circle cx='12' cy='12' r='2' fill='white'/></svg>" />
    <title>JobRadar</title>
    <script>
      try {
        const t = localStorage.getItem("theme");
        const dark = t === "dark" || (!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
